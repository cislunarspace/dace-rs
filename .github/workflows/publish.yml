# 推送 v* 标签或手动触发时发布到 crates.io（需要 CARGO_REGISTRY_TOKEN secret）。
# 与 release.yml 相互独立：本工作流失败不影响 GitHub Release 的创建。
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: 检查发布凭证
        env:
          HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::error::CARGO_REGISTRY_TOKEN secret 未配置；请由仓库管理员执行 gh secret set CARGO_REGISTRY_TOKEN"
          exit 1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
